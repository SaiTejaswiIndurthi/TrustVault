version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: trustvault-api:latest
    container_name: trustvault_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=sqlite:////app/backend/trustvault.db
      - SECRET_KEY=${SECRET_KEY:-trustvault-change-in-production-9834710892}
      - CSRF_SECRET=${CSRF_SECRET:-trustvault-csrf-change-in-prod}
      - CAPTCHA_PROVIDER=${CAPTCHA_PROVIDER:-dev}
      - CAPTCHA_SECRET_KEY=${CAPTCHA_SECRET_KEY:-dev_secret}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173}
    volumes:
      - vault_storage:/app/backend/storage/vault
      - sqlite_data:/app/backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend-dev:
    image: node:22-alpine
    container_name: trustvault_frontend_dev
    working_dir: /app
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    environment:
      - CHOKIDAR_USEPOLLING=true
    profiles:
      - dev

volumes:
  vault_storage:
    driver: local
  sqlite_data:
    driver: local
